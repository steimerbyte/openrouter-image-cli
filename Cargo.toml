[package]
name = "openrouter-image"
version = "0.1.2"
edition = "2021"
authors = ["Benjamin Steimer"]
description = "Standalone agent-steerable CLI for OpenRouter GPT Image models"
license = "MIT"
repository = "https://github.com/steimerbyte/openrouter-image"
rust-version = "1.75"

[lib]
name = "openrouter_image_core"
crate-type = ["lib"]
path = "src/lib.rs"

[[bin]]
name = "openrouter-image"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
dirs = "5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
anyhow = "1"
base64 = "0.22"
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
wiremock = "0.5.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
